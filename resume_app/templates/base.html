{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Resume Builder Pro{% endblock %}</title>

    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --ink: #0f1117;
            --gold: #ffbb00;
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body: 'DM Sans', system-ui, sans-serif;
        }

        body {
            font-family: var(--font-body);
        }

        h1,
        h2,
        h3,
        .font-display {
            font-family: var(--font-display);
        }

        [x-cloak] {
            display: none !important;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa',
                            500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a',
                        },
                        gold: '#ffbb00',
                        ink: '#0f1117'
                    }
                }
            }
        }
    </script>
    {% block extra_head %}{% endblock %}
</head>

<body class="bg-[#f7f7f975] text-slate-900 flex flex-col min-h-screen" x-data="{ 
        toasts: [], 
        addToast(msg, type='info') { 
            this.toasts.push({ msg, type, id: Date.now() });
            setTimeout(() => { if(this.toasts.length > 0) this.toasts = this.toasts.filter(t => t.id !== this.toasts[0].id) }, 5000);
        } 
      }" @notify.window="addToast($event.detail.msg, $event.detail.type)">

    <!-- Toast Notifications -->
    <div class="fixed top-24 right-6 z-[100] space-y-3 w-80 pointer-events-none">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 translate-x-12" x-transition:enter-end="opacity-100 translate-x-0"
                x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100"
                x-transition:leave-end="opacity-0 scale-95"
                class="p-4 rounded-2xl shadow-2xl pointer-events-auto flex items-center space-x-3 border bg-white border-slate-100 text-slate-800">
                <div class="p-2 rounded-xl" :class="toast.type === 'success' ? 'bg-green-50' : 'bg-primary-50'">
                    <svg class="w-4 h-4" :class="toast.type === 'success' ? 'text-green-600' : 'text-primary-600'"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <p class="text-[13px] font-bold" x-text="toast.msg"></p>
            </div>
        </template>
    </div>

    <!-- Navigation -->
    <nav class="bg-white/70 backdrop-blur-xl border-b border-[#e8e9ef] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <a href="{% url 'resume_list' %}" class="flex items-center gap-2 group">
                        <div
                            class="w-8 h-8 bg-ink rounded-lg flex items-center justify-center group-hover:bg-gold transition-colors duration-300">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                                </path>
                            </svg>
                        </div>
                        <span class="text-xl font-bold tracking-tight text-ink font-display">
                            Resume<span class="text-gold">Pro</span>
                        </span>
                    </a>
                </div>
                <div class="hidden md:flex space-x-8 text-[13px] font-semibold uppercase tracking-wider">
                    <a href="{% url 'resume_list' %}" class="text-slate-400 hover:text-ink transition">Dashboard</a>
                    <a href="{% url 'create_resume' %}" class="text-slate-400 hover:text-ink transition">New Project</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
    </script>
</body>

</html>
