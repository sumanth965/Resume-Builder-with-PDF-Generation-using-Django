<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: A4;
            margin: 15mm;
        }
        body {
            margin: 0;
            padding: 0;
            background: white;
        }
        /* Ensure specific fonts are loaded if available */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Lora:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;700&display=swap');
    </style>
</head>
<body>
    {% with theme_file="themes/"|add:template_name|add:".html" %}
        {% include theme_file %}
    {% endwith %}
</body>
</html>
