<div class="relative group bg-slate-50 p-4 rounded-2xl border border-slate-100 transition-all hover:bg-white hover:shadow-md">
    <button type="button" @click="$el.closest('.relative').remove(); prepareData();" class="absolute -top-2 -right-2 bg-white text-slate-400 hover:text-red-500 rounded-full p-1 shadow-sm opacity-0 group-hover:opacity-100 transition-opacity">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
    <div class="space-y-3">
        <input name="edu_institution[]" value="{{ institution }}" placeholder="University Name" class="w-full bg-transparent text-sm font-bold placeholder:text-slate-300 outline-none" />
        <div class="flex items-center space-x-4">
            <input name="edu_degree[]" value="{{ degree }}" placeholder="Degree (e.g. B.Tech)" class="flex-1 bg-transparent text-xs text-slate-500 outline-none" />
            <input name="edu_marks[]" value="{{ marks }}" placeholder="Marks %" class="w-16 bg-transparent text-xs text-slate-400 text-right outline-none" />
        </div>
    </div>
</div>
