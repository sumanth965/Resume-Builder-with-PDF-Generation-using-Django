<div class="relative group bg-[#fcfdfe] p-5 rounded-2xl border border-[#e8e9ef] transition-all hover:border-[#ffbb00] hover:shadow-lg hover:shadow-slate-200/50">
    <button type="button" @click="$el.closest('.relative').remove(); prepareData();" class="absolute -top-2 -right-2 bg-white text-slate-400 hover:text-red-500 rounded-full p-1.5 shadow-md opacity-0 group-hover:opacity-100 transition-all hover:scale-110">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
    <div class="space-y-4">
        <div class="space-y-1">
            <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest pl-1">Institution</label>
            <input name="edu_institution[]" value="{{ institution }}" placeholder="University Name" class="w-full bg-white px-3 py-2 rounded-lg border border-[#e8e9ef] text-xs font-bold text-[#0f1117] placeholder:text-slate-300 focus:border-[#ffbb00] outline-none transition-colors" />
        </div>
        <div class="flex items-end gap-3">
            <div class="flex-1 space-y-1">
                <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest pl-1">Degree</label>
                <input name="edu_degree[]" value="{{ degree }}" placeholder="Degree (e.g. B.Tech)" class="w-full bg-white px-3 py-2 rounded-lg border border-[#e8e9ef] text-xs text-[#3b3f50] outline-none focus:border-[#ffbb00] transition-colors" />
            </div>
            <div class="w-24 space-y-1">
                <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest pl-1">Result</label>
                <input name="edu_marks[]" value="{{ marks }}" placeholder="GPA/%" class="w-full bg-white px-3 py-2 rounded-lg border border-[#e8e9ef] text-xs text-[#8a8f9e] text-center outline-none focus:border-[#ffbb00] transition-colors" />
            </div>
        </div>
    </div>
</div>
