<div class="relative group bg-[#fcfdfe] p-5 rounded-2xl border border-[#e8e9ef] transition-all hover:border-[#ffbb00] hover:shadow-lg hover:shadow-slate-200/50">
    <button type="button" @click="$el.closest('.relative').remove(); prepareData();" class="absolute -top-2 -right-2 bg-white text-slate-400 hover:text-red-500 rounded-full p-1.5 shadow-md opacity-0 group-hover:opacity-100 transition-all hover:scale-110">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
    <div class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1">
                <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest pl-1">Company</label>
                <input name="exp_company[]" value="{{ company }}" placeholder="E.g. Tesla" class="w-full bg-white px-3 py-2 rounded-lg border border-[#e8e9ef] text-xs font-bold text-[#0f1117] placeholder:text-slate-300 focus:border-[#ffbb00] outline-none transition-colors" />
            </div>
            <div class="space-y-1">
                <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest pl-1">Role</label>
                <input name="exp_role[]" value="{{ role }}" placeholder="E.g. Lead Dev" class="w-full bg-white px-3 py-2 rounded-lg border border-[#e8e9ef] text-xs text-[#3b3f50] outline-none focus:border-[#ffbb00] transition-colors" />
            </div>
        </div>
        <div class="space-y-1">
            <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest pl-1">Responsibilities</label>
            <textarea name="exp_description[]" placeholder="Describe your key impact..." rows="3" class="w-full bg-white px-3 py-2 rounded-lg border border-[#e8e9ef] text-xs text-[#5a5e71] outline-none focus:border-[#ffbb00] transition-colors resize-none">{{ description }}</textarea>
        </div>
    </div>
</div>
