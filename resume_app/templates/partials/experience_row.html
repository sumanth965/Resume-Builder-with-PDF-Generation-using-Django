<div class="relative group bg-slate-50 p-4 rounded-2xl border border-slate-100 transition-all hover:bg-white hover:shadow-md">
    <button type="button" @click="$el.closest('.relative').remove(); prepareData();" class="absolute -top-2 -right-2 bg-white text-slate-400 hover:text-red-500 rounded-full p-1 shadow-sm opacity-0 group-hover:opacity-100 transition-opacity">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
    <div class="space-y-3">
        <div class="flex items-center justify-between">
            <input name="exp_company[]" value="{{ company }}" placeholder="Company Name" class="flex-1 bg-transparent text-sm font-bold placeholder:text-slate-300 outline-none" />
            <input name="exp_role[]" value="{{ role }}" placeholder="Role" class="w-24 bg-transparent text-[10px] text-slate-400 text-right outline-none uppercase font-bold" />
        </div>
        <textarea name="exp_description[]" placeholder="Describe your responsibilities..." rows="2" class="w-full bg-transparent text-xs text-slate-500 outline-none resize-none">{{ description }}</textarea>
    </div>
</div>
